name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            asset: win10-shell-linux-x64
          - os: windows-latest
            asset: win10-shell-windows-x64.exe
          - os: macos-latest
            asset: win10-shell-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux webview libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev patchelf
      - name: Build
        run: cargo build --release --no-default-features --features desktop
      - name: Stage
        shell: bash
        run: |
          bin="target/release/win10-shell"
          if [ "${{ runner.os }}" = "Windows" ]; then bin="target/release/win10-shell.exe"; fi
          mkdir -p stage
          cp "$bin" "stage/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: stage/${{ matrix.asset }}

  pwa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: wasm-bindgen
        run: |
          ver=$(cargo metadata --format-version 1 | jq -r '.packages[] | select(.name=="wasm-bindgen") | .version' | head -1)
          cargo install wasm-bindgen-cli --version "$ver" --locked
      - name: Build
        run: |
          cargo build --release --no-default-features --features web --target wasm32-unknown-unknown
          mkdir -p dist
          wasm-bindgen target/wasm32-unknown-unknown/release/win10-shell.wasm --out-dir dist --target web --out-name win10_shell
          cp web/index.html web/manifest.webmanifest web/sw.js web/icon.svg web/icon-192.png web/icon-512.png dist/
          (cd dist && zip -r ../win10-shell-pwa.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: win10-shell-pwa
          path: win10-shell-pwa.zip
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publish:
    needs: [desktop, pwa]
    if: always() && !cancelled() && (needs.pwa.result == 'success' || needs.desktop.result == 'success')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: win10-shell-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          name: Win10 Shell 0.1.0 beta
          fail_on_unmatched_files: false
          body: |
            Win10 Shell 0.1.0 beta. One Rust Start screen.

            - Linux x64: `win10-shell-linux-x64` (needs WebKitGTK 4.1)
            - Windows x64: `win10-shell-windows-x64.exe` (WebView2, already on Windows 11)
            - macOS Apple silicon: `win10-shell-macos-arm64` (first launch: right-click, Open)
            - PWA: install from https://wilsonsamiano.github.io/win10-shell/ or unzip `win10-shell-pwa.zip`
            - Android and iOS: build with the `mobile` feature. Android can be the home app. iOS cannot replace the system home screen.

            In the app, Settings → Check for updates. Install the new build over the one you have.
          files: artifacts/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pages:
    needs: pwa
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
