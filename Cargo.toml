[package]
name = "win10-shell"
version = "0.1.0"
edition = "2021"
description = "Windows Phone style Start screen. One Rust app for Linux, macOS, Windows, Android, iOS, and the browser."
license = "MIT"
publish = false

[dependencies]
dioxus = { version = "0.7.10", optional = true, default-features = false, features = ["macro", "html", "signals", "hooks", "launch"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "wasmbind"] }
futures-channel = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
open = "5"
dirs = "6"
ureq = { version = "2.12", default-features = false, features = ["json", "tls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Storage"] }
gloo-timers = { version = "0.3", features = ["futures"] }
gloo-net = "0.6"
js-sys = "0.3"

[features]
default = ["desktop"]
desktop = ["dep:dioxus", "dioxus/desktop"]
web = ["dep:dioxus", "dioxus/web"]
mobile = ["dep:dioxus", "dioxus/mobile"]

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"
